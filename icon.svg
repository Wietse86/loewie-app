  <path d="M236 338 q20 18 40 0" stroke="#1A0D05" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M236 338 q-8 6-12 4" stroke="#1A0D05" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M276 338 q8 6 12 4" stroke="#1A0D05" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Krulletjes op het voorhoofd -->
  <path d="M230 195 q8-20 18-2" stroke="#5C3210" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M252 185 q8-20 18-2" stroke="#5C3210" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M275 190 q8-20 18-2" stroke="#5C3210" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Lichte vacht midden borst/kin -->
