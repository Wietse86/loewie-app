  <ellipse cx="382" cy="230" rx="72" ry="95" fill="#7D4A1E" transform="rotate(10 382 230)"/>
  <!-- Binnenoor schaduw -->
  <ellipse cx="133" cy="238" rx="45" ry="68" fill="#5C3210" transform="rotate(-10 133 238)"/>
  <ellipse cx="379" cy="238" rx="45" ry="68" fill="#5C3210" transform="rotate(10 379 238)"/>

  <!-- Hoofd / gezicht -->
  <ellipse cx="256" cy="265" rx="148" ry="145" fill="#A0581A"/>

  <!-- Krullend vacht textuur hoofd — donkere krul-strepen -->
  <path d="M150 200 q10-18 22 0 q10-18 22 0" stroke="#7D4A1E" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M185 175 q10-18 22 0 q10-18 22 0" stroke="#7D4A1E" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M225 162 q10-18 22 0 q10-18 22 0" stroke="#7D4A1E" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M268 160 q10-18 22 0 q10-18 22 0" stroke="#7D4A1E" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M308 168 q10-18 22 0 q10-18 22 0" stroke="#7D4A1E" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M340 188 q10-18 22 0 q10-18 22 0" stroke="#7D4A1E" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M155 240 q10-16 20 0 q10-16 20 0" stroke="#7D4A1E" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M340 235 q10-16 20 0 q10-16 20 0" stroke="#7D4A1E" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Wenkbrauw-bogen (lichte vacht erboven) -->
  <ellipse cx="210" cy="242" rx="32" ry="20" fill="#C4782A" opacity="0.6"/>
  <ellipse cx="302" cy="242" rx="32" ry="20" fill="#C4782A" opacity="0.6"/>

  <!-- Ogen -->
  <ellipse cx="210" cy="262" rx="28" ry="28" fill="#1A0D05"/>
  <ellipse cx="302" cy="262" rx="28" ry="28" fill="#1A0D05"/>
  <!-- Oogglans -->
  <circle cx="220" cy="252" r="8" fill="white"/>
  <circle cx="312" cy="252" r="8" fill="white"/>
  <circle cx="224" cy="256" r="4" fill="white" opacity="0.6"/>
  <circle cx="316" cy="256" r="4" fill="white" opacity="0.6"/>

  <!-- Neus -->
  <ellipse cx="256" cy="318" rx="30" ry="22" fill="#1A0D05"/>
  <ellipse cx="248" cy="312" rx="9" ry="6" fill="#3D2010" opacity="0.5"/>

