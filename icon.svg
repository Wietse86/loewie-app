<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Achtergrond -->
  <rect width="512" height="512" rx="110" fill="#FAF7F2"/>

  <!-- Oren (links en rechts, breed en flapperig) -->
